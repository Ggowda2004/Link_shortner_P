name: Continuous Integration & Deployment Matrix

# Trigger this workflow every single time you push code to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Build and Deploy the FastAPI container
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Build and Deploy Backend to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: shortener-backend-api
        region: us-central1
        source: ./backend # 👈 Tells GitHub to build only the backend folder
        env_vars: |
          PYTHONPATH=.:/workspace/app
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}

  # JOB 2: Build and Deploy the React container
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Build and Deploy Frontend to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: shortener-frontend-web
        region: us-central1
        source: ./frontend # 👈 Tells GitHub to build only the frontend folder
        env_vars: |
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
